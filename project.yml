name: DayCast
options:
  bundleIdPrefix: com.scubasteve1999
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    MARKETING_VERSION: "1.0.7"
    CURRENT_PROJECT_VERSION: "131"

configs:
  Debug: debug
  Release: release

packages:
  MapboxMaps:
    url: https://github.com/mapbox/mapbox-maps-ios.git
    majorVersion: 11.0.0
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk.git
    majorVersion: 11.0.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    majorVersion: 3.0.0
  MapsGL:
    url: https://github.com/vaisala-xweather/mapsgl-apple-sdk
    from: 1.6.1

targetTemplates:
  AppTarget:
    type: application
    platform: iOS
    sources:
      - path: DayCast
        excludes:
          - "**/Info.plist"
          - "Features/Radar/NWSRadarOverlay.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scubasteve1999.DayCast
        INFOPLIST_FILE: DayCast/Info.plist
        DEVELOPMENT_TEAM: "742YD3WJAR"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1,2
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          # Avoids DayCast.debug.dylib injection that can fail simulator preflight checks (Xcode 16+).
          ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: CoreLocation.framework
      - sdk: MapKit.framework
      - sdk: Foundation.framework
      - sdk: UserNotifications.framework
      - sdk: BackgroundTasks.framework
      - sdk: PhotosUI.framework
      - sdk: WidgetKit.framework
      - sdk: SwiftData.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework

targets:
  DayCast:
    templates:
      - AppTarget
    entitlements:
      path: DayCast/DayCast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.scubasteve1999.DayCast
        aps-environment: production
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: DayCast/DayCast-Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: DayCast/DayCast.entitlements
    info:
      path: DayCast/Info.plist
      properties:
        CFBundleDisplayName: DayCast
        CFBundleName: DayCast
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        POSTHOG_API_KEY: "$(POSTHOG_API_KEY)"
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "DayCast uses your location to show accurate local weather forecasts and AI-powered insights."
        NSLocationAlwaysAndWhenInUseUsageDescription: "DayCast can use Apple’s low-power Significant Location Changes to refresh weather when you travel a significant distance. This is not continuous GPS tracking. You can turn this off in Settings."
        NSPhotoLibraryAddUsageDescription: "DayCast saves AI-generated weather images to your Photo Library when you choose Save."
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - fetch
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - com.daycast.alerts.refresh
        CFBundleURLTypes:
          - CFBundleURLName: com.daycast.DayCast
            CFBundleURLSchemes:
              - daycast
    dependencies:
      - target: DayCastWidgets
        embed: true
      - package: MapboxMaps
      - package: MapsGL
        product: MapsGL
      - package: firebase-ios-sdk
        product: FirebaseMessaging
      - package: PostHog
        product: PostHog

  DayCastWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DayCastWidgets
        excludes:
          - "**/Info.plist"
      - path: DayCast/Shared/Widget
      - path: DayCast/Shared/LiveActivity
      - path: DayCast/Shared/Design/DesignTokens.swift
      - path: DayCast/Shared/Models/Location.swift
      - path: DayCast/Shared/Models/OpenMeteoModels.swift
    entitlements:
      path: DayCastWidgets/DayCastWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.scubasteve1999.DayCast
    info:
      path: DayCastWidgets/Info.plist
      properties:
        CFBundleDisplayName: DayCast Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scubasteve1999.DayCast.DayCastWidgets
        INFOPLIST_FILE: DayCastWidgets/Info.plist
        DEVELOPMENT_TEAM: "742YD3WJAR"
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: 1,2
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
      - sdk: ActivityKit.framework
      - sdk: CoreLocation.framework

  DayCastTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DayCastTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scubasteve1999.DayCastTests
        DEVELOPMENT_TEAM: "742YD3WJAR"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1,2
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DayCast.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DayCast"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: DayCast

  DayCastUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DayCastUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scubasteve1999.DayCastUITests
        DEVELOPMENT_TEAM: "742YD3WJAR"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1,2
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DayCast
    dependencies:
      - target: DayCast

schemes:
  DayCast:
    build:
      targets:
        DayCast: all
        DayCastWidgets: all
        DayCastTests: [test]
        DayCastUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: DayCast/Configuration/GrokProducts.storekit
    test:
      config: Debug
      targets:
        - DayCastTests
        - DayCastUITests
    archive:
      config: Release

  DayCastWidgets:
    build:
      targets:
        DayCastWidgets: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
