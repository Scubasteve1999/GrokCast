name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/privacy.html"
      - "docs/terms.html"
      - "docs/support.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage public HTML only
        run: |
          mkdir -p public-site
          cp docs/index.html docs/privacy.html docs/terms.html docs/support.html public-site/
          # Do not publish the rest of docs/ (agent handoffs, ASC notes).

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
