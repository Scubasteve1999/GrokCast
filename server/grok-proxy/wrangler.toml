name = "daycast-grok-proxy"
main = "src/worker.js"
compatibility_date = "2026-08-01"

# Secrets (never in this file — `wrangler secret put <NAME>`):
#   XAI_API_KEY    the daycast-proxy-prod key
#   PROXY_SECRET   shared string the app sends; public by necessity
#   OWM_API_KEY    OpenWeatherMap key (One Call 4.0 is billed per request)

[vars]
BUNDLE_ID = "com.scubasteve1999.DayCast"
PRO_PRODUCT_IDS = "com.scubasteve1999.DayCast.pro.monthly,com.scubasteve1999.DayCast.pro.yearly"
ALLOWED_ENVIRONMENTS = "Production,Sandbox"
DAILY_CHAT_LIMIT = "150"
DAILY_IMAGE_LIMIT = "10"
GLOBAL_DAILY_LIMIT = "5000"
# Daily global call count that flags `over` on /v1/status. Not a cap — the cap is
# GLOBAL_DAILY_LIMIT. This is the "something changed, go look" line.
ALERT_THRESHOLD = "500"
# Kill switch: `wrangler deploy --var DISABLED:1` stops all AI without an app release.
DISABLED = "0"

# OpenWeatherMap data API. One Call 4.0 is billed per request, so the key lives
# here rather than in the app. Only cache misses are billed, hence the TTL.
OWM_DAILY_LIMIT = "5000"
OWM_CACHE_TTL = "300"
# Separate from DISABLED so killing AI does not also kill weather.
OWM_DISABLED = "0"

# Namespace title is SPOTTERCAST_USAGE — the account already has an unrelated
# USAGE namespace. The binding stays USAGE, which is what the worker references.
[[kv_namespaces]]
binding = "USAGE"
id = "cf48dd7853ca419db9d4224a43e58c1b"
